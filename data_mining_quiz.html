  {lec:8,sec:"Section 1: Data Challenges",q:"According to the sources, why is it often hard to find the data you need?",opts:["Data is scattered","Data is too small","Networks are too fast","Databases are empty"],ans:0,exp:"Data is often scattered over the network in many versions with subtle differences."},
  {lec:8,sec:"Section 1: Data Challenges",q:"What do users say summary data provides to the organization?",opts:["Higher costs","Real value","More confusion","Less security"],ans:1,exp:"Users believe that summary data has a real value to the organization."},
  {lec:8,sec:"Section 1: Data Challenges",q:"Historical data is essential because it holds the key to understanding data over ________.",opts:["Networks","Budget","Time","Space"],ans:2,exp:"Historical data allows users to understand data patterns and changes over time."},
  {lec:8,sec:"Section 1: Data Challenges",q:"What capability do users require for decision support?",opts:["Data deletion","What-if","Fast typing","Manual logs"],ans:1,exp:"'What-if' capabilities are a specific requirement mentioned for users to support decisions."},
  {lec:8,sec:"Section 2: Definitions and Characteristics",q:"Bill Inmon defines a data warehouse as a subject-oriented, integrated, nonvolatile, and ________ collection of data.",opts:["Small","Time-variant","Temporary","Unstructured"],ans:1,exp:"The four standard characteristics defined by Bill Inmon are subject-oriented, integrated, time-variant, and nonvolatile."},
  {lec:8,sec:"Section 2: Definitions and Characteristics",q:"Data warehousing is the process of transforming data into ________.",opts:["Information","Hardware","Electricity","Textbooks"],ans:0,exp:"It is defined as a process of transforming raw data into meaningful information for users."},
  {lec:8,sec:"Section 2: Definitions and Characteristics",q:"'Subject-oriented' means the warehouse is organized around subjects like:",opts:["Hard drives","Sales","Code","Keys"],ans:1,exp:"Data is organized around business subjects such as sales, product, and customer."},
  {lec:8,sec:"Section 2: Definitions and Characteristics",q:"Why is 'Integration' necessary for a data warehouse?",opts:["For speed","Consistency","Storage space","User passwords"],ans:1,exp:"Integration involves data preprocessing to ensure all data is consistent across multiple sources."},
  {lec:8,sec:"Section 2: Definitions and Characteristics",q:"The time horizon for a data warehouse (e.g., 5-10 years) is ________ than operational systems.",opts:["Shorter","Longer","Smaller","Equal"],ans:1,exp:"Data warehouses have a significantly longer time horizon to provide a historical perspective."},
  {lec:8,sec:"Section 2: Definitions and Characteristics",q:"What does 'Nonvolatile' mean in the context of a data warehouse?",opts:["Easily deleted","Read-only","Always changing","Highly explosive"],ans:1,exp:"Once data is recorded, it cannot be updated; it is stored in a read-only format."},

const LECTURE_INFO = {
  1: {title:"Data Mining Fundamentals & KDD", color:"var(--yellow-bright)"},
  2: {title:"Data Science & Mining Tasks", color:"var(--green-bright)"},
  3: {title:"Cluster Analysis", color:"var(--blue-bright)"},
  4: {title:"Hierarchical Clustering Analysis", color:"var(--red-bright)"},
  5: {title:"Fuzzy Logic", color:"var(--purple-bright)"},
  6: {title:"Fuzzy Inference Systems", color:"var(--cyan-bright)"},
  7: {title:"Genetic Algorithms", color:"var(--teal-bright)"},
  8: {title:"Data Warehousing", color:"var(--pink-bright)"},
  9: {title:"Data Warehouse Building", color:"var(--lime-bright)"},
  10: {title:"Web Mining", color:"var(--orange-bright)"},
};

let selectedLecs = [];
let quizQuestions = [];
let currentIdx = 0;
let score = 0;
let answered = false;
let timerInterval = null;
let timerLeft = 0;
let timerSec = 0;
let quizStart = 0;
let questionTimes = [];
let qStart = 0;
let results = [];
let streak = 0;

function buildHome() {
  const grid = document.getElementById('lecture-grid');
  grid.innerHTML = '';
  const lecs = [...new Set(QUESTIONS.map(q=>q.lec))].sort((a,b)=>a-b);
  lecs.forEach(lec => {
    const count = QUESTIONS.filter(q=>q.lec===lec).length;
    const info = LECTURE_INFO[lec];
    const div = document.createElement('div');
    div.className = 'lecture-card';
    div.dataset.lec = lec;
    div.innerHTML = `<span class="num" style="color:${info.color}">L${lec}</span>
      <div class="lec-title">${info.title}</div>
      <div class="q-count">${count} questions</div>`;
    div.onclick = () => toggleLec(lec, div);
    grid.appendChild(div);
  });
}

function toggleLec(lec, card) {
  const idx = selectedLecs.indexOf(lec);
  if(idx === -1) {
    selectedLecs.push(lec);
    card.style.borderColor = LECTURE_INFO[lec].color;
    card.style.background = 'rgba(240,237,228,0.1)';
  } else {
    selectedLecs.splice(idx, 1);
    card.style.borderColor = '';
    card.style.background = '';
  }
  updateSelectedLabel();
}

function selectAll() {
  selectedLecs = [...new Set(QUESTIONS.map(q=>q.lec))];
  document.querySelectorAll('.lecture-card').forEach(c => {
    const lec = parseInt(c.dataset.lec);
    c.style.borderColor = LECTURE_INFO[lec].color;
    c.style.background = 'rgba(240,237,228,0.1)';
  });
  updateSelectedLabel();
}

function updateSelectedLabel() {
  const lbl = document.getElementById('selected-label');
  if(selectedLecs.length === 0) lbl.textContent = 'Select a lecture above, or mix all';
  else lbl.textContent = `Selected: Lecture${selectedLecs.length>1?'s':''} ${selectedLecs.join(', ')}`;
}

function startQuiz() {
  if(selectedLecs.length === 0) { selectAll(); }
  let pool = QUESTIONS.filter(q => selectedLecs.includes(q.lec));
  const order = document.getElementById('sel-order').value;
  if(order === 'random') pool = pool.sort(() => Math.random() - 0.5);
  const countSel = document.getElementById('sel-count').value;
  const count = countSel === 'all' ? pool.length : Math.min(parseInt(countSel), pool.length);
  quizQuestions = pool.slice(0, count);
  timerSec = parseInt(document.getElementById('sel-timer').value);
  currentIdx = 0; score = 0; answered = false; results = []; streak = 0;
  quizStart = Date.now();
  showScreen('screen-quiz');
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderQuestion() {
  if(currentIdx >= quizQuestions.length) { showResult(); return; }
  const q = quizQuestions[currentIdx];
  answered = false;
  document.getElementById('q-section-badge').textContent = q.sec || 'Section';
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('quiz-meta').textContent = `Question ${currentIdx+1} / ${quizQuestions.length}`;
  document.getElementById('score-display').textContent = `Score: ${score}`;
  document.getElementById('progress-fill').style.width = (currentIdx/quizQuestions.length*100)+'%';
  document.getElementById('explanation-box').classList.remove('show');
  document.getElementById('next-btn').disabled = true;
  document.getElementById('streak-display').textContent = streak >= 3 ? `🔥 ${streak} streak!` : '';

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letters[i]}.</span>${opt}`;
    btn.onclick = () => selectAnswer(i);
    grid.appendChild(btn);
  });

  if(timerSec > 0) { startTimer(); }
  else { document.getElementById('timer-display').textContent = ''; }

  qStart = Date.now();
}

function startTimer() {
  clearInterval(timerInterval);
  timerLeft = timerSec;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerLeft--;
    updateTimerDisplay();
    if(timerLeft <= 0) {
      clearInterval(timerInterval);
      if(!answered) autoTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-display');
  el.textContent = timerLeft + 's';
  el.className = 'timer-display' + (timerLeft <= 10 ? ' warn' : '');
}

function autoTimeout() {
  answered = true;
  const q = quizQuestions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((b,i) => {
    b.disabled = true;
    if(i === q.ans) b.classList.add('reveal');
  });
  document.getElementById('explanation-text').textContent = '⏰ Time up! ' + q.exp;
  document.getElementById('explanation-box').classList.add('show');
  document.getElementById('next-btn').disabled = false;
  streak = 0;
  results.push({q:q, correct:false, chose:-1});
  questionTimes.push((Date.now()-qStart)/1000);
}

function selectAnswer(chosen) {
  if(answered) return;
  clearInterval(timerInterval);
  answered = true;
  const q = quizQuestions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const correct = chosen === q.ans;
  btns[chosen].classList.add(correct ? 'correct' : 'wrong');
  if(!correct) btns[q.ans].classList.add('reveal');

  if(correct) { score++; streak++; }
  else { streak = 0; }

  document.getElementById('explanation-text').textContent = q.exp;
  document.getElementById('explanation-box').classList.add('show');
  document.getElementById('score-display').textContent = `Score: ${score}`;
  document.getElementById('next-btn').disabled = false;
  document.getElementById('streak-display').textContent = streak >= 3 ? `🔥 ${streak} streak!` : '';
  results.push({q, correct, chose:chosen});
  questionTimes.push((Date.now()-qStart)/1000);
}

function nextQuestion() {
  currentIdx++;
  renderQuestion();
}

function showResult() {
  clearInterval(timerInterval);
  const total = quizQuestions.length;
  const pct = Math.round(score/total*100);
  const grade = pct>=90?'A+':pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F';
  const gradeColors = {'A+':'var(--green-bright)','A':'var(--green-bright)','B':'var(--blue-bright)','C':'var(--yellow-bright)','D':'var(--orange-bright)','F':'var(--red-bright)'};
  const msgs = {'A+':'Outstanding work! 🎓','A':'Excellent! 🌟','B':'Good job! 👏','C':'Keep studying! 📚','D':'More practice needed 💪','F':'Review the material again 📖'};
  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-grade').style.color = gradeColors[grade];
  document.getElementById('result-message').textContent = msgs[grade];
  document.getElementById('r-correct').textContent = score;
  document.getElementById('r-wrong').textContent = total - score;
  document.getElementById('r-pct').textContent = pct + '%';
  const avgT = questionTimes.length ? Math.round(questionTimes.reduce((a,b)=>a+b,0)/questionTimes.length) : 0;
  document.getElementById('r-time').textContent = avgT + 's';
  document.getElementById('review-section').style.display = 'none';
  showScreen('screen-result');
}

function showReview() {
  const sec = document.getElementById('review-section');
  if(sec.style.display !== 'none') { sec.style.display = 'none'; return; }
  const letters = ['A','B','C','D'];
  let html = '<div style="margin-top:1rem">';
  results.forEach((r,i) => {
    const icon = r.correct ? '<span class="tick-cross ok">✓</span>' : '<span class="tick-cross no">✗</span>';
    const answerLine = r.correct ? `Correct: ${letters[r.q.ans]}. ${r.q.opts[r.q.ans]}`
      : `Your answer: ${r.chose>=0?letters[r.chose]+'. '+r.q.opts[r.chose]:'Timed out'} | Correct: ${letters[r.q.ans]}. ${r.q.opts[r.q.ans]}`;
    html += `<div class="review-item">${icon}<div class="review-q"><div>Q${i+1}: ${r.q.q}</div><div class="review-ans">${answerLine}</div></div></div>`;
  });
  html += '</div>';
  sec.innerHTML = html;
  sec.style.display = 'block';
  sec.scrollIntoView({behavior:'smooth'});
}

function retryQuiz() {
  currentIdx = 0; score = 0; answered = false; results = []; streak = 0; questionTimes = [];
  quizQuestions = quizQuestions.sort(() => Math.random() - 0.5);
  quizStart = Date.now();
  showScreen('screen-quiz');
  renderQuestion();
}

function goHome() {
  clearInterval(timerInterval);
  showScreen('screen-home');
}

buildHome();
</script>
</body>
</html>
